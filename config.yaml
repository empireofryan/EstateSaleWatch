search: {lat: 39.739154, lon: -104.984703, miles: 100}
model: {name: ViT-B-16-SigLIP, pretrained: webli, batch_size: 32}
template: "a photo of {}"
# per-category score = sum of softmax probs over that category's positive prompts
thresholds: {mirror: 0.80, cabinet: 0.85, buddhist: 0.85, art_deco: 0.92}
caption_boost: 0.40      # added to score when the photo caption has a keyword
description_boost: 0.10  # added when only the sale description has one
max_images_per_run: 3000 # CI time guard; the rest is picked up next run
keywords:
  mirror: [mirror, cheval, trumeau]
  cabinet: [tansu, apothecary, card catalog, curio]
  art_deco: [art deco, =deco, waterfall, streamline, machine age, erte, "erté", lalique, chase chrome, bakelite, frankart, nouveau-deco]
  buddhist: [buddha, buddhist, thangka, tibetan, guanyin, kwan yin, singing bowl, butsudan, mala]
digest_cap_per_category: 20
# sale-level "high-end" flag: luxe prob per photo = softmax over these two lists only
luxe:
  positive:
    - fine antique furniture
    - museum-quality artwork
    - high-end designer furniture
    - sterling silver
    - fine crystal and porcelain
    - an elegant curated living room
    - a bronze sculpture
    - a hand-knotted oriental rug
    - a signed original painting
  ordinary:
    - a garage full of tools
    - a cluttered basement
    - cheap particleboard furniture
    - plastic storage bins
    - kitchen utensils on a table
    - piles of clothing
    - holiday decorations
    - yard equipment
    - auto parts
    - ordinary household clutter
    - a leather sofa and coffee table
    - mass-market home decor
    - a movie star poster print
    - rings and necklaces laid out for sale
    - a tray of costume jewelry
    - coins and paper currency
    - sports memorabilia and trading cards
    - a used car
sale:
  top_k: 15
  min_photos: 5
  frac_cut: 0.8       # a photo counts as 'luxe' at prob >= this (0.5 separated worse on calibration)
  w_top: 0.2          # weight of mean luxe prob over the top-K photos (saturates at 1.0 for big sales)
  w_frac: 0.8         # weight of fraction of photos at/above frac_cut
  kw_each: 0.04       # per distinct text keyword (title/description/captions)
  kw_cap: 0.20
  featured_bonus: 0.05  # API isLocally/Regionally/NationallyFeatured
  threshold: 0.92
  strip: 5            # thumbnails per standout in the digest
  keywords: [designer, fine art, signed, original art, collector, gallery, antique, sterling, baccarat, lalique, waterford, herman miller, knoll, eames, baker, henredon, stickley, rolex, persian rug, oriental rug, bronze, provenance, museum, luxury, high end, high-end, fine furniture]
prune_days: 14
prompts:
  mirror:
    - a large floor mirror
    - a full-length cheval mirror
    - a tall leaning mirror
    - a large ornate gilded wall mirror
