search: {lat: 39.739154, lon: -104.984703, miles: 100}
model: {name: ViT-B-16-SigLIP, pretrained: webli, batch_size: 32}
template: "a photo of {}"
# per-category score = sum of softmax probs over that category's positive prompts
thresholds: {mirror: 0.70, cabinet: 0.75, buddhist: 0.60}
caption_boost: 0.40      # added to score when the photo caption has a keyword
description_boost: 0.10  # added when only the sale description has one
max_images_per_run: 3000 # CI time guard; the rest is picked up next run
keywords:
  mirror: [mirror, cheval, trumeau]
  cabinet: [tansu, apothecary, card catalog, curio]
  buddhist: [buddha, buddhist, thangka, tibetan, guanyin, kwan yin, singing bowl, butsudan, mala]
digest_cap_per_category: 20
prune_days: 14
prompts:
  mirror:
    - a large floor mirror
    - a full-length cheval mirror
    - a tall leaning mirror
    - a large ornate gilded wall mirror
    - a large beveled wall mirror
    - a large round wall mirror
    - an arched mirror
    - a vanity dresser with a large mirror
    - a tall mirror standing in the corner of a bedroom
  cabinet:
    - an apothecary cabinet with many small drawers
    - a Japanese tansu chest
    - a Chinese lacquered cabinet
    - an antique carved cabinet
    - a card catalog cabinet
    - a mid-century modern credenza
    - a vintage curio cabinet
    - a painted folk-art cabinet
    - an industrial metal flat file cabinet
  buddhist:
    - a Buddha statue
    - a Buddha head sculpture
    - a Kwan Yin Guanyin statue
    - a Tibetan thangka painting
    - a Buddhist altar butsudan
    - a Tibetan singing bowl
    - mala prayer beads
    - Tibetan prayer flags
    - a bodhisattva statue
    - a Japanese temple bell
negatives:
  - a framed painting
  - a framed print in an ornate frame
  - framed pictures hanging on a wall
  - a window
  - a television
  - a dresser without a mirror
  - a dresser with drawers
  - a china cabinet with glass doors
  - a bookshelf full of books
  - kitchen cabinets
  - a wall shelf
  - hand tools and power tools
  - a rack of clothing
  - shoes and handbags
  - a table of dishes and glassware
  - porcelain figurines
  - a lamp
  - a brass plate
  - a clock
  - a sofa
  - a dining table and chairs
  - a bed
  - an office desk
  - a rug
  - books on a table
  - toys
  - a bicycle
