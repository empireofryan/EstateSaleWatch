name: watch
on:
  schedule:
    - cron: "0 12 * * *"   # daily 12:00 UTC
  workflow_dispatch:
concurrency:
  group: estate-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_HOME: ${{ github.workspace }}/.cache/hf
      TORCH_HOME: ${{ github.workspace }}/.cache/torch
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      APP_URL: ${{ secrets.APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/cache@v4
        with:
          path: .cache/hf
          key: model-ViT-B-16-SigLIP-webli   # bump if config.yaml model changes
      - run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Scan
        run: python watch.py
      - name: Commit scan state
        if: always()
        run: |
          git config user.name "estate-watch[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add state/seen.json state/sales.json
          git diff --cached --quiet || { git commit -m "state: scan $(date -u +%F) [skip ci]"; git pull --rebase -q; git push; }
      - name: Daily email
        run: python watch.py --email
