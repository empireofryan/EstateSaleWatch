name: watch
on:
  schedule:
    - cron: "0 12 * * *"   # daily 12:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: scan or digest
        type: choice
        options: [scan, digest]
        default: scan

concurrency:
  group: estate-watch
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_HOME: ${{ github.workspace }}/.cache/hf
      TORCH_HOME: ${{ github.workspace }}/.cache/torch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/cache@v4
        with:
          path: .cache/hf
          key: model-ViT-B-16-SigLIP-webli   # bump if config.yaml model changes
      - run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Decide what to run
        id: plan
        run: |
          MODE="${{ github.event.inputs.mode }}"
          DOW=$(date -u +%u)
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "scan=true" >> "$GITHUB_OUTPUT"
            echo "digest=true" >> "$GITHUB_OUTPUT"   # daily digest; only never-shown hits
          else
            [ "$MODE" = "scan" ] && echo "scan=true" >> "$GITHUB_OUTPUT"
            [ "$MODE" = "digest" ] && echo "digest=true" >> "$GITHUB_OUTPUT"
          fi
          exit 0
      - name: Scan
        if: steps.plan.outputs.scan == 'true'
        run: python watch.py
      - name: Commit scan state
        if: steps.plan.outputs.scan == 'true'
        run: |
          git config user.name "estate-watch[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add state/*.json
          git diff --cached --quiet || { git commit -m "state: scan $(date -u +%F) [skip ci]"; git pull --rebase -q; git push; }
      - name: Digest
        if: steps.plan.outputs.digest == 'true'
        run: python watch.py --digest
      - name: Open digest issue
        if: steps.plan.outputs.digest == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f digest.md ]; then
            N=$(cat digest_count.txt)
            gh label create digest --color 0E8A16 --force
            for n in $(gh issue list --label digest --state open --json number -q '.[].number'); do gh issue close "$n" -c "Superseded by today's digest."; done
            gh issue create --title "Estate sale finds – $(date -u +%F) ($N)" \
              --label digest --body-file digest.md
            git config user.name "estate-watch[bot]"
            git config user.email "actions@users.noreply.github.com"
            git add state/*.json
            git diff --cached --quiet || { git commit -m "state: digest $(date -u +%F) [skip ci]"; git pull --rebase -q; git push; }
          else
            echo "no new hits, no issue"
          fi
